name: Build and test
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install visual QA image comparison dependency
        run: python -m pip install -r tools/requirements-visual-qa.txt
      - name: Configure Windows x64 Release build
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Configure Ubuntu Release build
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure --output-log build/ctest.log
      - name: Run native visual QA on Ubuntu
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" cmake --build build --target visual_qa --parallel 2
      - name: Run native visual QA on Windows
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target visual_qa --parallel 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PixelForge-Visual-QA-${{ matrix.os }}
          path: |
            build/visual-qa/
            build/interaction-qa/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Windows'
        with:
          name: PixelForge-Windows-CTest-Log
          path: build/ctest.log
          retention-days: 7
      - name: Install portable Windows package
        if: runner.os == 'Windows'
        run: cmake --install build --config Release --prefix build/PixelForge-Windows
      - name: Validate and archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "build/PixelForge-Windows"
          $required = @(
            "$package/PixelForge.exe",
            "$package/README.md",
            "$package/THIRD_PARTY_NOTICES.md",
            "$package/assets/studio_tiles.png",
            "$package/assets/LICENSE.txt",
            "$package/examples/rpg.json",
            "$package/examples/platformer.json",
            "$package/licenses/SDL3-LICENSE.txt",
            "$package/licenses/Dear-ImGui-LICENSE.txt",
            "$package/licenses/nlohmann-json-LICENSE.txt",
            "$package/licenses/stb-LICENSE.txt",
            "$package/docs/release-readiness.md",
            "$package/docs/proposed-MIT-license.md",
            "$package/docs/release-notes-v1.0.0-rc2.md",
            "$package/docs/screenshots/rpg-editor.png",
            "$package/docs/screenshots/rpg-playtest.png",
            "$package/docs/screenshots/platformer-editor.png",
            "$package/docs/screenshots/platformer-playtest.png"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Portable package is missing $path"
            }
          }
          $archive = "build/PixelForge-v1.0.0-rc2-windows-x64.zip"
          Compress-Archive -Path "$package/*" -DestinationPath $archive -Force
          if ((Get-Item $archive).Length -eq 0) {
            throw "Portable package ZIP is empty"
          }
          $portable = Join-Path $env:RUNNER_TEMP "PixelForge-Zip-Verification"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $portable -Force
          foreach ($path in $required) {
            $relative = $path.Substring($package.Length + 1)
            $extractedPath = Join-Path $portable $relative
            if (-not (Test-Path $extractedPath -PathType Leaf)) {
              throw "Release ZIP is missing $relative"
            }
          }
          Push-Location $env:RUNNER_TEMP
          $previousVideoDriver = $env:SDL_VIDEODRIVER
          try {
            $env:SDL_VIDEODRIVER = "dummy"
            & (Join-Path $portable "PixelForge.exe") --smoke
            if ($LASTEXITCODE -ne 0) {
              throw "Portable PixelForge smoke test failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            if ($null -eq $previousVideoDriver) {
              Remove-Item Env:SDL_VIDEODRIVER -ErrorAction SilentlyContinue
            } else {
              $env:SDL_VIDEODRIVER = $previousVideoDriver
            }
            Pop-Location
          }
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PixelForge-v1.0.0-rc2-windows-x64.zip" | Set-Content -Path "${archive}.sha256" -Encoding ascii
          Write-Output "Release candidate ZIP size: $((Get-Item $archive).Length) bytes"
          Write-Output "Release candidate ZIP SHA-256: $hash"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: PixelForge-v1.0.0-rc2-windows-x64
          path: |
            build/PixelForge-v1.0.0-rc2-windows-x64.zip
            build/PixelForge-v1.0.0-rc2-windows-x64.zip.sha256
          retention-days: 14

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure core ASan and UBSan suites
        run: >-
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
          -DPIXELFORGE_EDITOR=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build core sanitizer suites
        run: cmake --build build-sanitize --parallel 2
      - name: Run core sanitizer suites
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure
